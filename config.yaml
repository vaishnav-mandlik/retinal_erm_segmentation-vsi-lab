# === Storage roots ===
# Read-only location where source videos or previously prepared data live.
#data_root: "/CHANGE/ME/retinal_segmentation_data"

data_root: "/Users/saurav1/python/masters/arizona/2nd/fall/retinal_segmentation/work_dir"

# Safe working area for this run (local disk by default).
#work_root: "/CHANGE/ME/work/retinal_segmentation_runs"
work_root: "/Users/saurav1/python/masters/arizona/2nd/fall/retinal_segmentation/work_dir"
run_id: "run1_2025-09-25"

# Optional final sync target (e.g., your Google Drive shared folder). Empty string disables sync.
final_sync_root: ""

# Safety and reproducibility
## if true, would remove existing contents in the folder
allow_overwrite: true
## continue to add contents to existing folder.
allow_append_to_existing: true
dry_run: false
crop_using_masks: true

# Cases/videos to process
cases:
  - case_id: "case4"
    video_path: "{data_root}/raw_videos/3.mp4"
    fps: 1
  - case_id: "case5"
    video_path: "{data_root}/raw_videos/5.mp4"
    fps: 1
  - case_id: "case6"
    video_path: "{data_root}/raw_videos/6.mp4"
    fps: 1
  - case_id: "case7"
    video_path: "{data_root}/raw_videos/6.mp4"
    fps: 1
  - case_id: "case1"
    video_path: "{data_root}/raw_videos/6.mp4"
    fps: 1
  - case_id: "case2"
    video_path: "{data_root}/raw_videos/6.mp4"
    fps: 1
  - case_id: "case3"
    video_path: "{data_root}/raw_videos/6.mp4"
    fps: 1

# Frame extraction settings
extract:
  qscale: 1
  filename_pattern: "frame_%06d.jpg"
  start: 00:00:07   # hh:mm:ss of exactly where to start from.
  end: 15     # as in "duration" number of seconds after the start time
  fps: 1

# De-duplication & blur filtering
dedup:
  use_ssim: true
  ssim_threshold: 0.98
  blur_filter: true
  laplacian_var_min: 20.0

# Cropping (removing black borders) directly on color images pre-annotation
crop:
  method: "largest_component"   # or "hough_circle"
  roi_margin_px: 24
  sample_stride: 10
  per_video_fixed_roi: true

# Cropping (removing black borders) after annotation driven by masks
maskcrop:
  # --- Mode and sampling ----------------------------------------
  per_video_fixed_roi: true      # use one generous union bbox per case if possible
  sample_stride: 1               # sample every 2nd mask when estimating ROI
  # --- Bounding-box safety margins ------------------------------
  margin_px: 130                 # extra pixels on each side beyond the detected bbox
  # --- Color-based retina union (optional but recommended) ------
  use_color_union: false          # combine mask bbox with non-black retina bbox, prefer true with per_video_fixed_roi = false
  allow_overwrite: true         # set true to auto-clear old crops if re-running


previews:
  enabled: true
  include:
    - Original
    - CLAHE
    - Gamma correct
    - 2-Ch (R+B)
    - Scharr (mag)      #
    #    - Unsharp
    #    - G-only
    #    - B-only
    #    - PCA PC1
    #    - Kirsch (col)      # color kirsch

  cols: 4   # optional, default 4
  auto_crop: true

tags:
  # Name of the Supervisely tag that encodes surgical phase
  phase_tag_name: "surgery phase"

  # Canonical / allowed phase values (used for validation)
  # SHOULD MATCH the SUpervisely TAGS
  valid_phase_values:
    - "dye injection"
    - "flap initiation"
    - "peeling progression"
    - "completion"

  # Map Supervisely class titles → boolean columns in tags.csv
  class_to_boolean:
    "ERM": "membrane_present"
    "Forceps": "forceps_present"
    "Light tool": "light_tool_present"

  class_aliases:
    "epiretinal membrane": "ERM"
    "forceps 1": "Forceps"
    "light": "Light tool"


# resize before training.
resize:
  enabled: true
  target_size: [512, 512]      # (H, W)  <--- SINGLE source of truth for image + mask pair for Training, resizing, augs
#  target_size: [768, 768]      # (H, W)  <--- SINGLE source of truth for image + mask pair for Training, resizing, augs
  method: "letterbox"            # "letterbox" (default) or "center-crop"
  pad_value_rgb: [0, 0, 0]       # padding for images if letterbox
  pad_value_mask: 0              # padding for masks if letterbox
  allow_overwrite: true

preview_augs:
  prefer_resized: true
  max_images_per_case: 30

  grid:
    rows: 2
    cols: 3
    gap_px: 6

  mask_preview:
    dilate_px: 0 # 2
    mode: binary_any
    # optional: override class colors (in BGR)
    class_colors:
      - [0, 0, 0]        # 0 background
      - [255, 255, 0]    # 1 forceps -> cyan
      - [0, 255, 255]    # 2 light tool -> yellow
      - [255, 0, 255]    # 3 membrane -> magenta

  rows:
    - { name: "Rotate +6°",   op: rotate,    deg: 6 }
    - { name: "Scale ×1.03",  op: scale,     scale: 1.03 }
    - { name: "Translate 3%", op: translate, frac: 0.03 }
    - { name: "Color Jitter", op: jitter,    b: 0.10, c: 0.10, s: 0.10, h: 0.05 }
    - { name: "H-Flip",       op: hflip }


train:
  # === data selection (kept from your pipeline semantics) ===
  prefer_resized: true          # use frames_resized/masks_resized if present
  use_maskcrop: false            # prefer frames_maskcrop + masks_multiclass_crop
  use_binary_masks: false       # true => train only ERM (1-channel); false => multi-head (ERM, Forceps, Light tool)
  binary_class_name: "ERM"      # which class to keep when use_binary_masks=true

  class_names: ["ERM", "Forceps", "Light tool"]        # canonical order used everywhere

  # SHOULD MATCH to work_dir/obj_class_to_machine_color.json values
  # ERM or alias membrane
  class_index_map:
    "ERM": 1
    "Light tool": 2
    "Forceps": 3

  # Optional phase labels (Track C) — must match tags.csv 'phase' values
  phase_labels: ["dye injection", "flap initiation", "peeling progression", "completion"]
  phase_csv_path: "{work_root}/{run_id}/metadata/all_tags.csv"  # created by tags step

  # === model selection ===
  model: "deeplabv3p"               # one of: unetpp | deeplabv3p | [  segformer_b0 | segformer_b2 not fully supported yet  ]
  encoder_name: "resnet101"      # for SMP backbones (unetpp/deeplabv3p); e.g., resnet34 | resnet50 | resnet101
  encoder_weights: "imagenet"   # SMP: "imagenet" or null
  phase_head:
    enabled: true               # Track C (multi-task)
    lambda: 0 #  0.05 to 0.5                 # weight for phase CE loss
    enc_feats_hint: 512         # encoder C5 channels (512 for R34, 2048 for R50). Autodetected if possible.
    #    Loss: L = L_seg + λ·CE_phase, λ≈0.3.

  batch_size: 8
  epochs: 80
  early_stop_patience: 15
  early_stop_min_epochs: 15
  early_stop_enabled: false
  save_top_k: 5

  lambda_tversky: 0.0  # 0 disabled, else 0.1 - 0.25
  oversample_membrane: true
  # A data sampling bias: pick frames where ERM is present a bit more often. Effect: model sees more positive ERM pixels → learns ERM faster/stronger.
  oversample_membrane_weight: 1.3  # tune 1 to 2
  lr: 1.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  amp: false                    # AMP off on MPS; enable on CUDA

  #  Per-channel multiplier on the positive term of Binary CrossEnr.
  #	 With [3.0, 1.0, 1.0]  telling the loss: “penalize ERM false-negatives ~3× more than the others.”
  class_weights: [3.0, 1.0, 1.0]   # per positive channel (ERM, Forceps, Light tool); ignored if binary
  monitor: "present_only_mean"        # or "class:ERM" or "all_mean"

  # === augmentations (kept in parity with preview) ===
  augment:
    enable: true
    rotate_deg: 8
    scale_range: [0.97, 1.03]
    translate_frac: 0.02
    hflip_prob: 0.0
    jitter: [0.10, 0.10, 0.10, 0.05]  # (brightness, contrast, saturation, hue)

  # === output locations ===
  out_dir: "{work_root}/{run_id}/training"
  ckpt_every: 4
  qualitative_every: 4          # dump qualitative grids each epoch
  debug_shapes: False

  # === device ===
  device: "mps"                # auto | cpu | cuda | mps
  eval_topk: false



metrics:
#  boundary_tol_px: 4        # for 768 Max pixel offset allowed between predicted and GT edges when computing Boundary-F1.
  boundary_tol_px: 3        # for 512 Max pixel offset allowed between predicted and GT edges when computing Boundary-F1.
  thresholds: [0.5, 0.5, 0.5]  # Per-class sigmoid cutoffs for binarizing masks [ERM, Forceps, Light tool].
#  fp_min_pixels: 50         # for 512 Ignore ERM/instrument blobs smaller than 50 px when counting false positives on absent frames.
  fp_min_pixels: 110         # for 768Ignore ERM/instrument blobs smaller than 50 px when counting false positives on absent frames.

# Split by case (avoid leakage)
splits:
  train: ["case1", "case2", "case3", "case4"]
  val:   ["case5"]
  test:  ["case6", "case7"]

#  train: ["case1"]
#  val:   ["case4", "case6"]
#  test:  ["case2", "case3", "case5", "case7"]
